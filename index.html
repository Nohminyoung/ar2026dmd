<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>결합 AR · 제6회 청주대학교 디지털미디어디자인학과 졸업전시회</title>
<meta name="description" content="포스터를 비추면 졸업전시 포스터 '결합'이 공간에 펼쳐지는 웹 AR">
<link rel="stylesheet" href="/loader/css/loader.css">
<link rel="stylesheet" href="/src/style.css">
<script>document.documentElement.classList.add('intro-loading');</script>
<script defer src="/loader/js/main-intro-loading.js" onerror="document.documentElement.classList.remove('intro-loading')"></script>
<script src="/vendor/xr/xr.js" async data-preload-chunks="slam"></script>
</head>
<body>
<!-- 로딩 화면 (public/loader). 진행률은 실제 작품 다운로드에 맞춰 올라가요. -->
<div id="introLoader" class="intro-loader" role="progressbar" aria-label="작품 로딩" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
  <div class="intro-loader-mark">
    <div class="intro-loader-stage" aria-hidden="true"><svg class="intro-loader-field" focusable="false"></svg></div>
    <span class="intro-loader-percent" data-loading-percent aria-hidden="true">0%</span>
  </div>
  <p class="credit loader-credit">AR 엔진: 8th Wall Engine © Niantic Spatial, Inc. · <a href="/vendor/xr/LICENSE-engine-binary.txt" target="_blank" rel="noopener">라이선스·보증 부인 고지</a></p>
</div>
<main id="app" data-state="IDLE" data-loading-content>
  <canvas id="camerafeed" aria-hidden="true"></canvas>

  <!-- 시작 패널: 로딩이 끝나면 바로 카메라를 켜요. 이 패널은 자동으로 시작할 수 없을 때만 보여요
       (아이폰의 동작 센서 허용은 터치가 꼭 한 번 필요함 · 카톡 등 앱 안 브라우저 · ✕로 끈 뒤). 글자는 여기서 고치면 돼요. -->
  <section id="intro" class="intro" hidden aria-labelledby="intro-title">
    <div class="panel">
      <p id="intro-title" class="panel-title">화면을 터치하면 AR이 시작돼요</p>
      <p id="intro-sub" class="panel-sub">카메라와 동작 센서 사용을 물어보면 ‘허용’을 눌러 주세요</p>
      <div id="inapp" class="notice" hidden>
        <p>이 앱 안의 브라우저에서는 AR이 열리지 않을 수 있어요.<br>아이폰은 <b>Safari</b>, 안드로이드는 <b>Chrome</b>에서 열어 주세요.</p>
        <div class="row"><code id="page-url"></code><button id="copy-url" class="ghost small" type="button">주소 복사</button></div>
      </div>
      <button id="start" class="primary" type="button">AR 시작하기</button>
    </div>
    <p class="credit">AR 엔진: 8th Wall Engine © Niantic Spatial, Inc. · <a href="/vendor/xr/LICENSE-engine-binary.txt" target="_blank" rel="noopener">라이선스·보증 부인 고지</a></p>
  </section>

  <div id="hud" class="hud" hidden>
    <p id="status" class="status" role="status" aria-live="polite">포스터를 찾아보세요</p>
    <div class="hud-actions">
      <button id="reset" class="ghost" type="button">위치 다시 맞추기</button>
      <button id="close" class="icon" type="button" aria-label="AR 끝내기">✕</button>
    </div>
  </div>

  <section id="end" class="sheet end" hidden aria-label="체험 끝">
    <p class="eyebrow">체험이 끝났어요</p>
    <button id="replay" class="primary" type="button">다시 체험하기</button>
    <button id="home" class="ghost" type="button">홈페이지 바로 가기</button>
  </section>

  <section id="error" class="sheet error" hidden role="alert">
    <p id="error-title" class="title">카메라를 열 수 없어요</p>
    <p id="error-text" class="lead"></p>
    <button id="retry" class="primary" type="button">다시 시도</button>
  </section>
</main>
<script type="module" src="/src/main.js"></script>
</body>
</html>
